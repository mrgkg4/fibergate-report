<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#f8f9fa"/>
  <text x="480" y="35" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1a1a2e">Agent 3 — Guichet OI: PAR France — System Architecture</text>

  <!-- Pilote -->
  <rect x="30" y="100" width="130" height="70" rx="10" fill="#e0f2f1" stroke="#00897B" stroke-width="2"/>
  <text x="95" y="130" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#00695C">Pilote</text>
  <text x="95" y="148" text-anchor="middle" font-family="Arial" font-size="11" fill="#00695C">Guichet OI</text>
  <text x="95" y="162" text-anchor="middle" font-family="Arial" font-size="9" fill="#4DB6AC">injecte fichier Excel</text>

  <!-- Excel Parser -->
  <rect x="200" y="100" width="140" height="70" rx="10" fill="#e8eaf6" stroke="#3F51B5" stroke-width="2"/>
  <text x="270" y="127" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#283593">Excel Parser</text>
  <text x="270" y="145" text-anchor="middle" font-family="Arial" font-size="11" fill="#283593">Python / openpyxl</text>
  <text x="270" y="162" text-anchor="middle" font-family="Arial" font-size="9" fill="#7986CB">parse all rows</text>

  <!-- Classifier -->
  <rect x="380" y="100" width="160" height="90" rx="10" fill="#fce4ec" stroke="#AD1457" stroke-width="2"/>
  <text x="460" y="125" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#880E4F">Classifier</text>
  <text x="460" y="145" text-anchor="middle" font-family="Arial" font-size="10" fill="#AD1457">• Retour Complétude</text>
  <text x="460" y="160" text-anchor="middle" font-family="Arial" font-size="10" fill="#AD1457">• Nouvelle Demande</text>
  <text x="460" y="175" text-anchor="middle" font-family="Arial" font-size="10" fill="#AD1457">• Demande Modification</text>

  <!-- SUIVI SharePoint -->
  <rect x="380" y="240" width="160" height="70" rx="10" fill="#e8f4fd" stroke="#0078D4" stroke-width="2"/>
  <text x="460" y="267" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#003087">SharePoint</text>
  <text x="460" y="285" text-anchor="middle" font-family="Arial" font-size="11" fill="#003087">SUIVI PAR Agilis</text>
  <text x="460" y="300" text-anchor="middle" font-family="Arial" font-size="9" fill="#42A5F5">lookup Agent Traitant</text>

  <!-- Decision -->
  <rect x="590" y="240" width="140" height="70" rx="10" fill="#fff3e0" stroke="#E65100" stroke-width="2"/>
  <text x="660" y="265" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#BF360C">Already</text>
  <text x="660" y="282" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#BF360C">Assigned?</text>
  <text x="660" y="300" text-anchor="middle" font-family="Arial" font-size="9" fill="#E65100">YES → same agent</text>

  <!-- Round Robin -->
  <rect x="590" y="100" width="140" height="70" rx="10" fill="#f1f8e9" stroke="#689F38" stroke-width="2"/>
  <text x="660" y="127" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#33691E">Round Robin</text>
  <text x="660" y="145" text-anchor="middle" font-family="Arial" font-size="11" fill="#33691E">Algorithm</text>
  <text x="660" y="162" text-anchor="middle" font-family="Arial" font-size="9" fill="#8BC34A">fair load balancing</text>

  <!-- Planner -->
  <rect x="775" y="100" width="140" height="70" rx="10" fill="#fff8e1" stroke="#FFC107" stroke-width="2"/>
  <text x="845" y="127" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#F57F17">MS Planner</text>
  <text x="845" y="145" text-anchor="middle" font-family="Arial" font-size="11" fill="#F57F17">Task creation</text>
  <text x="845" y="162" text-anchor="middle" font-family="Arial" font-size="9" fill="#FFCA28">type + priority + deadline</text>

  <!-- Consultant Pool -->
  <rect x="775" y="240" width="140" height="70" rx="10" fill="#fce4ec" stroke="#E91E63" stroke-width="2"/>
  <text x="845" y="267" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#880E4F">Consultant</text>
  <text x="845" y="285" text-anchor="middle" font-family="Arial" font-size="11" fill="#880E4F">Pool</text>
  <text x="845" y="300" text-anchor="middle" font-family="Arial" font-size="9" fill="#E91E63">N consultants</text>

  <!-- Arrows -->
  <line x1="162" y1="135" x2="198" y2="135" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="173" y="128" font-family="Arial" font-size="10" fill="#555">.xlsx</text>

  <line x1="342" y1="135" x2="378" y2="135" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="352" y="128" font-family="Arial" font-size="10" fill="#555">classify</text>

  <line x1="460" y1="192" x2="460" y2="238" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="472" y="218" font-family="Arial" font-size="10" fill="#555">lookup</text>

  <line x1="542" y1="275" x2="588" y2="275" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="556" y="268" font-family="Arial" font-size="10" fill="#555">check</text>

  <line x1="660" y1="238" x2="660" y2="172" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="670" y="210" font-family="Arial" font-size="10" fill="#555">if NO</text>

  <line x1="732" y1="135" x2="773" y2="135" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="744" y="128" font-family="Arial" font-size="10" fill="#555">assign</text>

  <line x1="730" y1="285" x2="773" y2="285" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="738" y="278" font-family="Arial" font-size="10" fill="#555">if YES → direct</text>

  <line x1="845" y1="172" x2="845" y2="238" stroke="#E91E63" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="855" y="210" font-family="Arial" font-size="10" fill="#880E4F">notify</text>

  <!-- Legend -->
  <rect x="30" y="350" width="900" height="130" rx="8" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="375" font-family="Arial" font-size="12" font-weight="bold" fill="#333">Workflow summary:</text>
  <text x="50" y="395" font-family="Arial" font-size="11" fill="#555">1. Pilote injecte un fichier Excel contenant les demandes entrantes</text>
  <text x="50" y="412" font-family="Arial" font-size="11" fill="#555">2. Excel Parser lit chaque ligne et envoie au Classifier</text>
  <text x="50" y="429" font-family="Arial" font-size="11" fill="#555">3. Classifier détermine le type : Retour Complétude / Nouvelle Demande / Demande Modification</text>
  <text x="50" y="446" font-family="Arial" font-size="11" fill="#555">4. SUIVI SharePoint vérifie si un Agent Traitant est déjà assigné</text>
  <text x="50" y="463" font-family="Arial" font-size="11" fill="#555">5. Si non assigné → Round Robin sélectionne le prochain consultant disponible</text>
  <text x="50" y="480" font-family="Arial" font-size="11" fill="#555">6. MS Planner crée la tâche avec type, priorité, et deadline → consultant notifié</text>
</svg>