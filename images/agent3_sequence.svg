<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="700" viewBox="0 0 1050 700">
  <rect width="1050" height="700" fill="#f8f9fa"/>
  <text x="525" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1a1a2e">Sequence Diagram — Agent 3: Guichet OI Task Distribution</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Lifeline boxes -->
  <rect x="30" y="50" width="90" height="36" rx="6" fill="#e0f2f1" stroke="#00897B" stroke-width="1.5"/>
  <text x="75" y="73" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#00695C">Pilote</text>

  <rect x="160" y="50" width="90" height="36" rx="6" fill="#e8eaf6" stroke="#3F51B5" stroke-width="1.5"/>
  <text x="205" y="73" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#283593">Parser</text>

  <rect x="300" y="50" width="110" height="36" rx="6" fill="#fce4ec" stroke="#AD1457" stroke-width="1.5"/>
  <text x="355" y="73" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#880E4F">Classifier</text>

  <rect x="460" y="50" width="100" height="36" rx="6" fill="#ede7f6" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="510" y="73" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#4A148C">SUIVI (SP)</text>

  <rect x="610" y="50" width="100" height="36" rx="6" fill="#f1f8e9" stroke="#689F38" stroke-width="1.5"/>
  <text x="660" y="69" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#33691E">Round Robin</text>

  <rect x="760" y="50" width="90" height="36" rx="6" fill="#fff8e1" stroke="#F9A825" stroke-width="1.5"/>
  <text x="805" y="73" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#E65100">Planner</text>

  <rect x="900" y="50" width="100" height="36" rx="6" fill="#fce4ec" stroke="#C62828" stroke-width="1.5"/>
  <text x="950" y="73" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#880E4F">Consultant</text>

  <!-- Lifelines -->
  <line x1="75" y1="86" x2="75" y2="680" stroke="#00897B" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="205" y1="86" x2="205" y2="680" stroke="#3F51B5" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="355" y1="86" x2="355" y2="680" stroke="#AD1457" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="510" y1="86" x2="510" y2="680" stroke="#7B1FA2" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="660" y1="86" x2="660" y2="680" stroke="#689F38" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="805" y1="86" x2="805" y2="680" stroke="#F9A825" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="950" y1="86" x2="950" y2="680" stroke="#C62828" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- Step 1: inject Excel -->
  <line x1="75" y1="115" x2="200" y2="115" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="138" y="110" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">inject_excel(file.xlsx)</text>
  <line x1="200" y1="130" x2="80" y2="130" stroke="#999" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="138" y="143" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">✓ N rows parsed</text>

  <!-- Loop frame -->
  <rect x="25" y="160" width="990" height="485" rx="6" fill="none" stroke="#00897B" stroke-width="1.3"/>
  <rect x="25" y="160" width="80" height="18" rx="3" fill="#e0f2f1" stroke="#00897B" stroke-width="1"/>
  <text x="65" y="173" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#00695C">loop</text>
  <text x="115" y="173" font-family="Arial" font-size="10" fill="#555">[for each row in Excel]</text>

  <!-- Step 2: classify -->
  <line x1="205" y1="195" x2="350" y2="195" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="278" y="190" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">classify(row_data)</text>
  <line x1="350" y1="210" x2="210" y2="210" stroke="#999" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="278" y="225" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">type: Retour Complétude | Nvelle Demande | Modif</text>

  <!-- Step 3: SUIVI lookup -->
  <line x1="205" y1="250" x2="505" y2="250" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="355" y="245" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">lookup_agent_traitant(PC / ref)</text>
  <line x1="505" y1="265" x2="210" y2="265" stroke="#999" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="355" y="280" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">Agent Traitant (or null)</text>

  <!-- Alt frame -->
  <rect x="45" y="298" width="955" height="240" rx="5" fill="none" stroke="#E65100" stroke-width="1.2"/>
  <rect x="45" y="298" width="40" height="16" rx="3" fill="#fff3e0" stroke="#E65100" stroke-width="0.8"/>
  <text x="65" y="310" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#BF360C">alt</text>

  <!-- YES: Agent found -->
  <text x="100" y="330" font-family="Arial" font-size="10" fill="#2E7D32">[Agent Traitant found → route to same agent]</text>
  <line x1="205" y1="348" x2="800" y2="348" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="500" y="343" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">create_task(assigned_to=Agent Traitant, type=classified_type)</text>
  <line x1="800" y1="363" x2="210" y2="363" stroke="#999" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="500" y="378" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">✓ task created → existing agent</text>

  <!-- Alt divider -->
  <line x1="45" y1="400" x2="1000" y2="400" stroke="#E65100" stroke-width="0.8" stroke-dasharray="7 4"/>

  <!-- NO: Round robin -->
  <text x="100" y="420" font-family="Arial" font-size="10" fill="#C62828">[No Agent Traitant — unassigned case]</text>
  <line x1="205" y1="438" x2="655" y2="438" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="430" y="433" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">get_next_consultant()</text>
  <line x1="655" y1="453" x2="210" y2="453" stroke="#999" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="430" y="468" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">next available consultant (round robin)</text>

  <line x1="205" y1="488" x2="800" y2="488" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="500" y="483" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">create_task(assigned_to=RR_consultant, type, priority, deadline)</text>
  <line x1="800" y1="503" x2="210" y2="503" stroke="#999" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="500" y="518" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">✓ task created → round robin consultant</text>

  <!-- Notify -->
  <line x1="805" y1="555" x2="945" y2="555" stroke="#E91E63" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="875" y="550" text-anchor="middle" font-family="Arial" font-size="10" fill="#880E4F">assign + notify</text>

  <!-- Log assignment -->
  <line x1="205" y1="585" x2="505" y2="585" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="355" y="580" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">log_assignment(consultant, type, ref)</text>
  <line x1="505" y1="600" x2="210" y2="600" stroke="#999" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="355" y="615" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">✓ suivi updated</text>

  <!-- Next row -->
  <text x="500" y="640" text-anchor="middle" font-family="Arial" font-size="10" fill="#00897B">↻ next row...</text>

  <!-- Report back -->
  <line x1="205" y1="655" x2="80" y2="655" stroke="#999" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="138" y="668" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">✓ all rows processed</text>
</svg>