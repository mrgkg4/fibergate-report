  <rect x="170" y="50" width="100" height="36" rx="6" fill="#e8f5e9" stroke="#388E3C" stroke-width="1.5"/>
  <text x="220" y="73" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1B5E20">OWA</text>
