  <line x1="80" y1="325" x2="365" y2="325" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="222" y="320" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">click PF → Edit all</text>
  <line x1="80" y1="345" x2="365" y2="345" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="222" y="340" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">fill(date_creation, Ref_POI_PAR1)</text>
  <line x1="365" y1="358" x2="85" y2="358" stroke="#999" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="222" y="371" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">✓ saved + item_url</text>

  <line x1="80" y1="388" x2="515" y2="388" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="297" y="383" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">open POI alerte bucket</text>
  <line x1="80" y1="408" x2="515" y2="408" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="297" y="403" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">create_task(title=POI OEIE, deadline+10j)</text>
  <line x1="80" y1="428" x2="515" y2="428" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="297" y="423" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">fill_notes(PF, PC, AS-OEIE-POI, lien)</text>
  <line x1="515" y1="441" x2="85" y2="441" stroke="#999" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="297" y="454" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">✓ task created</text>

  <line x1="515" y1="468" x2="655" y2="468" stroke="#E91E63" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="585" y="463" text-anchor="middle" font-family="Arial" font-size="10" fill="#880E4F">assign + notify</text>

  <line x1="80" y1="490" x2="215" y2="490" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="148" y="485" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">mark_as_read()</text>
</svg>