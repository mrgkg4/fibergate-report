  <line x1="80" y1="115" x2="215" y2="115" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="148" y="110" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">login(OWA_USER, OWA_PASS)</text>
  <line x1="215" y1="128" x2="85" y2="128" stroke="#999" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="148" y="141" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">✓ authenticated</text>

  <line x1="80" y1="158" x2="215" y2="158" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="148" y="153" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">navigate_FINOI()</text>
  <line x1="215" y1="171" x2="85" y2="171" stroke="#999" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
