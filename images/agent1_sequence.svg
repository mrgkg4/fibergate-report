<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <rect width="900" height="620" fill="#f8f9fa"/>
  <text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1a1a2e">Sequence Diagram — Agent 1: POI Workflow</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Lifeline boxes -->
  <rect x="30" y="50" width="100" height="36" rx="6" fill="#e3f2fd" stroke="#1976D2" stroke-width="1.5"/>
