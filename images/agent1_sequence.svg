  <text x="148" y="272" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">AS / OEIE / PC / type_POI / Etablissement</text>

  <line x1="80" y1="285" x2="365" y2="285" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
