  <text x="370" y="73" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#4A148C">SharePoint</text>
  <rect x="470" y="50" width="100" height="36" rx="6" fill="#fff8e1" stroke="#F9A825" stroke-width="1.5"/>
  <text x="520" y="73" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#E65100">Planner</text>
  <rect x="610" y="50" width="100" height="36" rx="6" fill="#fce4ec" stroke="#C62828" stroke-width="1.5"/>
  <text x="660" y="73" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#880E4F">Agent</text>

  <!-- Lifelines -->
  <line x1="80" y1="86" x2="80" y2="600" stroke="#1976D2" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="220" y1="86" x2="220" y2="600" stroke="#388E3C" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="370" y1="86" x2="370" y2="600" stroke="#7B1FA2" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="520" y1="86" x2="520" y2="600" stroke="#F9A825" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="660" y1="86" x2="660" y2="600" stroke="#C62828" stroke-width="1" stroke-dasharray="5 4"/>

